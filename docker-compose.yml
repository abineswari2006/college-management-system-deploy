services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: college_management
      POSTGRES_USER: cms_local
      POSTGRES_PASSWORD: cms_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - college-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_local -d college_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  college-postgres: